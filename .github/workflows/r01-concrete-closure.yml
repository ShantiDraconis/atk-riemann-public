name: R01 public algebra and reflection
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/r01-rational-spectral-exclusion/**'
      - '.github/workflows/r01-concrete-closure.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y elan
      - name: Compile the public modules with Mathlib v4.34.1
        run: |
          git clone --depth 1 --branch v4.34.1 https://github.com/leanprover-community/mathlib4 "$RUNNER_TEMP/mathlib"
          cd "$RUNNER_TEMP/mathlib"
          lake exe cache get Mathlib
          for name in Closure Exclusion DualMultipliers; do
            lake env lean -DwarningAsError=true "$GITHUB_WORKSPACE/research/r01-rational-spectral-exclusion/$name.lean"
          done
